// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
    classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      // play-services-ads 25.4.0 is compiled with Kotlin 2.3.0 which is
      // incompatible with the Kotlin 2.1.x used by Expo SDK 55.
      // Force the last version compatible with Kotlin 2.1.x.
      force "com.google.android.gms:play-services-ads:25.3.0"
      force "com.google.android.gms:play-services-ads-lite:25.3.0"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
